[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "idearel"
version = "1.0.0"
description = "Interpretable detection of multidimensional relationships between ideas (WHAT/HOW patterns, cascade of matchers, 54 rules)"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["nltk>=3.8", "numpy>=1.24", "gensim>=4.3", "spacy>=3.7", "openpyxl>=3.1", "fastapi>=0.110", "uvicorn>=0.27"]

[project.optional-dependencies]
llm = ["transformers>=4.40", "torch>=2.1", "accelerate>=0.27"]
dev = ["pytest>=7", "httpx>=0.27"]

[project.scripts]
idearel = "idearel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
